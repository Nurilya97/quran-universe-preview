name: Quran Universe data pilots

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qamar:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-qamar]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official QAMAR supplementary material
        run: |
          curl -L --fail --retry 3 --retry-delay 3             -o qamar-supplement.zip             'https://aclanthology.org/attachments/2026.abjadnlp-1.38.OptionalSupplementaryMaterial.zip'
          test -s qamar-supplement.zip
          unzip -l qamar-supplement.zip
      - name: Extract QAMAR supplementary material
        run: |
          mkdir -p qamar-supplement
          unzip -q qamar-supplement.zip -d qamar-supplement
          echo "QAMAR files:"
          find qamar-supplement -maxdepth 4 -type f -printf '%p\n' | sort
      - name: Upload QAMAR supplementary material
        uses: actions/upload-artifact@v4
        with:
          name: qamar-official-supplement
          path: qamar-supplement
          retention-days: 14

  tafsircenter:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-tafsircenter]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Tafsir Center database
        run: |
          curl -L --fail --retry 3 --retry-delay 3             -o quran.db             'https://huggingface.co/datasets/tafsircenter/tafsir-mcp-data/resolve/main/quran.db?download=true'
          test -s quran.db
      - name: Extract 2:197 into Quran Universe coordinates
        run: |
          python scripts/import_tafsircenter_pilot.py quran.db --output tafsircenter-2-197.json
      - name: Upload Tafsir Center pilot
        uses: actions/upload-artifact@v4
        with:
          name: tafsircenter-2-197
          path: tafsircenter-2-197.json
          retention-days: 14
