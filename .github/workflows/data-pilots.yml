name: Quran Universe data pilots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qamar:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-qamar]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Quarantine official QAMAR supplementary material
        run: node scripts/quarantine-download.mjs qamar-acl-supplement
      - name: Inspect QAMAR archive without extraction
        run: |
          unzip -Z1 .quarantine/qamar-acl-supplement/qamar-supplement.zip | sort | tee qamar-files.txt
          if grep -E -i '(corpus|dataset|\.csv$|\.tsv$|\.json$|\.parquet$|\.sqlite$|\.db$|\.tei$)' qamar-files.txt > qamar-potential.txt; then
            echo 'Potential corpus-like files found. Manual source/licence/hash review is required before any extraction or ingestion.'
          fi
      - name: Upload QAMAR quarantine evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qamar-quarantine-evidence
          path: |
            .quarantine/qamar-acl-supplement/qamar-supplement.zip.integrity.json
            qamar-files.txt
            qamar-potential.txt
          if-no-files-found: ignore
          retention-days: 14

  tafsircenter:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-tafsircenter]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Quarantine and verify official Tafsir Center database
        run: node scripts/quarantine-download.mjs tafsircenter-quran-db --require-approved
      - name: Extract 2:197 into Quran Universe coordinates
        run: |
          python scripts/import_tafsircenter_pilot.py .quarantine/tafsircenter-quran-db/quran.db --output tafsircenter-2-197.json
      - name: Upload Tafsir Center pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tafsircenter-2-197
          path: |
            tafsircenter-2-197.json
            .quarantine/tafsircenter-quran-db/quran.db.integrity.json
          retention-days: 14
