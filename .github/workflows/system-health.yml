name: Quran Universe system health

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/system-health.yml'
      - '.github/workflows/security-audit.yml'
      - 'scripts/system-audit.mjs'
      - 'scripts/security-audit.mjs'
      - 'scripts/tamper-guard.mjs'
      - 'scripts/quarantine-download.mjs'
      - 'scripts/sync-generated.mjs'
      - 'scripts/upstream-watch.mjs'
      - 'src/data/research/upstreams.json'
      - 'src/data/research/externalDataIntegrity.json'
      - 'src/data/research/securityBaseline.json'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm run security:deps
      - name: Verify synchronized system
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Chromium verification runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Approved UI contracts
        run: npx playwright test
      - name: Watch skills and source freshness
        id: watch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upstream-watch.mjs
      - name: Quarantine QAMAR supplement for release watch
        id: qamar
        continue-on-error: true
        run: |
          node scripts/quarantine-download.mjs qamar-acl-supplement
          unzip -Z1 .quarantine/qamar-acl-supplement/qamar-supplement.zip > qamar-files.txt
          if grep -E -i '(corpus|dataset|\.csv$|\.tsv$|\.json$|\.parquet$|\.sqlite$|\.db$|\.tei$)' qamar-files.txt > qamar-potential.txt; then
            {
              echo
              echo '## QAMAR release watch'
              echo
              echo 'Potential corpus-like files appeared in the quarantined ACL supplement:'
              sed 's/^/- /' qamar-potential.txt
              echo
              echo 'Manual source/licence/hash review is required before extraction or ingestion.'
            } >> system-health-report.md
            exit 1
          fi
      - name: Open or update maintenance issue
        if: steps.watch.outcome == 'failure' || steps.qamar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='Automated maintenance watch — review required'
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file system-health-report.md
          else
            gh issue create --title "$title" --body-file system-health-report.md
          fi
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quran-universe-system-health
          path: |
            system-health-report.md
            qamar-files.txt
            qamar-potential.txt
            .quarantine/qamar-acl-supplement/qamar-supplement.zip.integrity.json
          if-no-files-found: ignore
          retention-days: 30
