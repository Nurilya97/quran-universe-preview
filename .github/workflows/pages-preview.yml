name: Deploy Quran Universe spatial preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate Quran Universe data
        run: npm run test:content
      - name: Build spatial preview
        run: |
          VITE_BUILD_SHA="$GITHUB_SHA" npm run build
          printf '%s' "$GITHUB_SHA" > dist/version.txt
          cp dist/spatial.html "dist/build-${GITHUB_SHA::8}.html"
          cp dist/spatial.html dist/latest.html
          cp dist/spatial.html dist/index.html
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Quran Universe</title>
            <script>
              (function () {
                var base = '/quran-universe-preview/';
                if (location.pathname.indexOf(base + 'build-') === 0) {
                  location.replace(base + '?v=' + Date.now());
                }
              }());
            </script>
          </head>
          <body style="margin:0;background:#050709;color:#dfe3e5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
            <a href="/quran-universe-preview/" style="color:#dfe3e5">Open Quran Universe</a>
          </body>
          </html>
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
