name: Deploy Quran Universe spatial preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency vulnerability gate
        run: npm run security:deps
      - name: Verify synchronized Quran Universe system
        run: npm run check
      - name: Build spatial preview
        run: |
          VITE_BUILD_SHA="$GITHUB_SHA" npm run build
          printf '%s' "$GITHUB_SHA" > dist/version.txt
          cp dist/spatial.html "dist/build-${GITHUB_SHA::8}.html"
          cp dist/spatial.html dist/latest.html
          cp dist/spatial.html dist/index.html
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="referrer" content="no-referrer" />
            <title>Quran Universe</title>
          </head>
          <body style="margin:0;background:#050709;color:#dfe3e5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
            <a href="/quran-universe-preview/" style="color:#dfe3e5">Open Quran Universe</a>
          </body>
          </html>
          EOF
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify approved UI contracts
        run: npx playwright test
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quran-universe-ui-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
