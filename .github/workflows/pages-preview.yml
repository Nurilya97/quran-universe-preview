name: Deploy Quran Universe spatial preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate Quran Universe data
        run: npm run test:content
      - name: Build spatial preview
        run: |
          VITE_BUILD_SHA="$GITHUB_SHA" npm run build
          printf '%s' "$GITHUB_SHA" > dist/version.txt
          cp dist/spatial.html "dist/build-${GITHUB_SHA::8}.html"
          cp dist/spatial.html dist/latest.html
          cp dist/spatial.html dist/index.html
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Quran Universe</title>
            <script>
              (function () {
                var base = '/quran-universe-preview/';
                if (location.pathname.indexOf(base + 'build-') === 0) {
                  location.replace(base + '?v=' + Date.now());
                }
              }());
            </script>
          </head>
          <body style="margin:0;background:#050709;color:#dfe3e5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
            <a href="/quran-universe-preview/" style="color:#dfe3e5">Open Quran Universe</a>
          </body>
          </html>
          EOF
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify approved UI contracts
        run: npx playwright test
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-universe-ui-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pilot_tafsircenter:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-tafsircenter]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download official Tafsir Center database
        run: |
          curl -L --fail --retry 3 --retry-delay 3             -o quran.db             'https://huggingface.co/datasets/tafsircenter/tafsir-mcp-data/resolve/main/quran.db?download=true'
          test -s quran.db
      - name: Extract 2:197 into Quran Universe coordinates
        run: |
          python scripts/import_tafsircenter_pilot.py quran.db --output tafsircenter-2-197.json
          python - <<'PY'
          import json
          data = json.load(open('tafsircenter-2-197.json', encoding='utf-8'))
          assert data['reference'] == '2:197'
          assert data['wordCount'] == 29
          assert data['words'][25]['id'] == 'q:2:197:w26'
          print('Tafsir Center pilot:', data['wordCount'], 'words')
          print('w26:', data['words'][25]['text'], 'root=', data['words'][25]['root'])
          PY
      - name: Upload Tafsir Center pilot
        uses: actions/upload-artifact@v4
        with:
          name: tafsircenter-2-197
          path: tafsircenter-2-197.json
          retention-days: 14

