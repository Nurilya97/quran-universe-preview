name: Quran Universe design branch checks

on:
  push:
    branches:
      - design/quran-universe-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency vulnerability gate
        run: npm run security:deps
      - name: Verify Quran Universe system
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Approved UI + design evidence
        run: npx playwright test tests/ui/approved-ui.spec.js tests/ui/design-evidence.spec.js
      - name: Upload design evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quran-universe-design-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 30
