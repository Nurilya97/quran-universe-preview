name: Quran Universe preview integrity

on:
  push:
    branches:
      - "sync/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:content
        continue-on-error: true
      - run: npm run build
