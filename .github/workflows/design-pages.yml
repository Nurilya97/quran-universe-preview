name: Deploy isolated Quran Universe design preview

on:
  push:
    branches:
      - design/quran-universe-v1
    paths:
      - 'src/**'
      - 'spatial.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preserved baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: archive/ui-baseline-2026-09-23
          path: baseline
      - name: Checkout design branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: design/quran-universe-v1
          path: design
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify and build preserved baseline
        working-directory: baseline
        env:
          VITE_BUILD_SHA: d2e3e6c5481768d56ee3a8c866c8cebce993cb38
        run: |
          npm ci
          npm run check
          npm run build

      - name: Verify and build design preview
        working-directory: design
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BASE_PATH: /quran-universe-preview/design-v1/
        run: |
          npm ci
          npm run check
          npm run build

      - name: Assemble baseline root and isolated design path
        run: |
          rm -rf site
          mkdir -p site/design-v1
          cp -R baseline/dist/. site/
          cp baseline/dist/spatial.html site/index.html
          cp baseline/dist/spatial.html site/latest.html
          printf '%s' 'd2e3e6c5481768d56ee3a8c866c8cebce993cb38' > site/version.txt

          cp -R design/dist/. site/design-v1/
          cp design/dist/spatial.html site/design-v1/index.html
          printf '%s' "${GITHUB_SHA}" > site/design-v1/version.txt

          cat > site/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="referrer" content="no-referrer" />
            <title>Quran Universe</title>
          </head>
          <body style="margin:0;background:#050709;color:#dfe3e5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
            <a href="/quran-universe-preview/" style="color:#dfe3e5">Open Quran Universe</a>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site

  deploy:
    environment:
      name: design-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy combined baseline + design preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
